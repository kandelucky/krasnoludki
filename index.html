<!DOCTYPE html>
<html lang="pl" data-theme="dojo" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Przypadki z Bobim</title>
<!-- installable on a phone: manifest + icons; sw.js keeps an offline copy -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#211d52">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Przypadki">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="lib/daisyui.css">
<link rel="stylesheet" href="lib/daisyui-themes.css">
<link rel="stylesheet" href="theme-milioni.css">
<script src="lib/tailwind.js"></script>
<script src="sim-bridge.js"></script>
<style type="text/tailwindcss">
  /* Register daisyUI colours with Tailwind, otherwise opacity variants like text-base-content/60 do not exist.
     Keep this block first; an @apply of an unknown class stops ALL Tailwind on the page. */
  @theme reference {
    --color-base-100: var(--color-base-100); --color-base-200: var(--color-base-200); --color-base-300: var(--color-base-300);
    --color-base-content: var(--color-base-content);
    --color-primary: var(--color-primary); --color-primary-content: var(--color-primary-content);
    --color-secondary: var(--color-secondary); --color-secondary-content: var(--color-secondary-content);
    --color-accent: var(--color-accent); --color-accent-content: var(--color-accent-content);
    --color-neutral: var(--color-neutral); --color-neutral-content: var(--color-neutral-content);
    --color-info: var(--color-info); --color-success: var(--color-success);
    --color-warning: var(--color-warning); --color-error: var(--color-error);
  }
  /* Screens: exactly one visible at a time */
  #app > section { display: none; }
  #app > section.on { display: flex; }
  /* 🖨️ print screen (Ninja 10's): the real A4 sheet (794 × 1123 px = 210 × 297 mm) scaled into #prPv — page 1 shows, both print */
  #prPv { position: relative; overflow: hidden; border-radius: 4px; background: #fff; box-shadow: 0 3px 14px rgba(0,0,0,.5); flex: none; }
  #prPv iframe { position: absolute; left: 0; top: 0; width: 794px; height: 1123px; border: 0; transform-origin: 0 0; pointer-events: none; }
  /* Theme swatch (from Ninja 10): the inner .sw carries data-theme, so its dots are painted in that theme */
  .swb { border-radius: 14px; padding: 0; height: 34px; }
  .swb.cur { outline: 3px solid var(--color-primary); outline-offset: 2px; }
  .sw { display: flex; gap: 4px; justify-content: center; align-items: center; height: 100%; border-radius: 12px;
        background: var(--color-base-100); border: 2px solid var(--color-base-300); }
  .sw > i { width: 14px; height: 14px; border-radius: 50%; }
  /* the exam's wrong answer: no sheet, no right answer — the card shakes once in red */
  .xNo { color: var(--color-error); animation: xNo .45s; }
  @keyframes xNo { 0%, 100% { transform: none; } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
                   60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
  /* „+75" after a correct answer pops up next to the feedback line */
  .pop { display: inline-block; animation: pop .6s ease-out; }
  @keyframes pop { 0% { transform: translateY(10px) scale(.5); opacity: 0; } 40% { transform: translateY(-4px) scale(1.2); opacity: 1; }
                   100% { transform: none; opacity: 1; } }
  /* something that just appeared pops in (cellPop also pops the wrong-answer sheet's number) */
  .gPop { animation: cellPop .45s cubic-bezier(.3, 1.6, .6, 1) both; }
  @keyframes cellPop { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
  /* the result's Sunny & Bobi when the drill is memorized: they hop, one after the other */
  .dance > * { display: inline-block; animation: dance .5s ease-in-out infinite alternate; }
  .dance > :nth-child(2) { animation-delay: .25s; }
  @keyframes dance { from { transform: translateY(0) rotate(-6deg); } to { transform: translateY(-10px) rotate(6deg); } }

  /* result screen (as Ninja 10): „Teraz" | „Rekord"; #res gets .rBeat when the counting score passes the old record */
  .tag { display: inline-block; max-width: 100%; padding: 4px 18px; border-radius: 14px; border: 3px solid #1d1b2e;
         box-shadow: 0 0 0 3.5px #fff, 0 4px 0 3.5px rgba(0,0,0,.25); font-weight: 800; white-space: nowrap;
         transform: rotate(-3deg); }
  .tag.gold { background: var(--color-warning); color: var(--color-warning-content); }
  .tag.rPop { transform: scale(0) rotate(-3deg); }
  #res.rBeat .tag.rPop { animation: recPop .5s cubic-bezier(.3, 1.7, .5, 1) forwards; }
  @keyframes recPop { 0% { transform: scale(0) rotate(-3deg); } 100% { transform: scale(1) rotate(-3deg); } }
  .rStrike { position: relative; display: inline-block; }
  .rStrike::after { content: ""; position: absolute; left: -8%; top: 50%; height: 5px; width: 0; border-radius: 3px;
                    background: var(--color-warning); transform: rotate(-14deg); transform-origin: left; transition: width .35s ease-out; }
  #res.rBeat .rStrike::after { width: 116%; }
  .rOld { transition: opacity .4s; }
  #res.rBeat .rOld { opacity: .5; }
  .rGlow { transition: box-shadow .4s, border-color .4s; }
  #res.rBeat .rGlow { border-color: var(--color-warning);
                      box-shadow: 0 0 0 3px var(--color-warning), 0 0 26px color-mix(in oklab, var(--color-warning) 55%, transparent); }
  .rBs { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px; pointer-events: none; z-index: 20;
         animation: recBs .95s ease-out forwards; }
  .rBs svg { width: 100%; height: 100%; display: block; }
  @keyframes recBs { 0% { transform: translate(0, 0) rotate(0) scale(.3); opacity: 1; }
                     100% { transform: translate(var(--dx), var(--dy)) rotate(var(--r)) scale(1); opacity: 0; } }

  /* Wrong answer (as Ninja 10): a sheet slides up over the pad; the right case's number pops up on its top edge, half out.
     Plain base colours — the only red is the small ✕ beside the child's pick. */
  .win { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: none; text-align: center;
         padding: 62px 16px 22px; border-radius: 28px 28px 0 0;
         border: 2px solid var(--color-base-300); border-bottom: 0; background: var(--color-base-200);
         box-shadow: 0 -4px 20px #0004; }
  .win.on { display: block; animation: winIn .55s cubic-bezier(.3, 1.3, .6, 1) both; }
  .win.on.off { animation: winOut .3s ease-in both; }
  .win.on.off * { animation: none !important; }
  .wg { position: absolute; left: 50%; top: 0; transform: translate(-50%, -58%); }
  .win.on .wg > * { animation: cellPop .45s .3s cubic-bezier(.3, 1.6, .6, 1) both; }
  @keyframes winIn { from { transform: translateY(105%); } to { transform: none; } }
  @keyframes winOut { from { transform: none; } to { transform: translateY(105%); } }
  #pad { transition: opacity .25s; }
  #pad.dim { opacity: .2; pointer-events: none; }
  /* the drill's pause window: an opaque screen behind it — the card must not show */
  #pauseAsk[open] { background-color: var(--color-base-100); }

  /* a home button (.rec, from Ninja 10): its name above, the record on a darker band along the bottom —
     „🏆 640" left, ☆ → ⭐ right once memorized. .big = the exam */
  .btn.rec { padding: 0; gap: 0; overflow: hidden; align-items: stretch; flex-direction: column; }
  .rec .nm { flex: 1; display: flex; align-items: center; justify-content: center; padding: 10px 6px 6px; }
  .rec .ft { display: flex; justify-content: space-between; align-items: center; min-height: 1.6rem; padding: 3px 10px;
             font-size: .78rem; font-weight: 800; background: color-mix(in oklab, var(--color-primary-content) 16%, transparent); }
  .rec .ft .st0 { opacity: .55; font-size: .95rem; line-height: 1; }
  .rec.big .nm { padding-top: 18px; }
  .rec.big .ft { font-size: 1rem; padding: 5px 14px; }
  /* the sea sentence (home, table, drills — not the exam): each word's first letter in its case's colour */
  /* always one line (Lasha: „too big — make it fit on one line"): the size follows the screen width, at most text-lg */
  .sent { font-weight: 700; line-height: 1.45; white-space: nowrap; font-size: min(1.125rem, 3.4vw); }
  .sent b { font-weight: 900; font-size: 1.3em; }
  /* a chapter's word (② Po kolei): painted whole in its case's colour and underlined */
  .sent .cur { text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 3px; }
  /* Sprawdź: the sentence with its gap; a right tap puts the word into the gap (.ok, in the case's colour) */
  #dQ.sq { font-size: 2rem; line-height: 1.35; }
  .gap { display: inline-block; min-width: 118px; height: 1em; margin: 0 4px;
         border-bottom: 4px dashed color-mix(in oklab, var(--color-base-content) 50%, transparent); }
  .gap.ok { min-width: 0; height: auto; border-bottom: 4px solid currentColor; }
  /* Jaki to przypadek?: the sentence's word, already right, underlined — no colour until the right tap */
  #dQ u { text-decoration-thickness: 4px; text-underline-offset: 6px; }

  /* ---------- „dojo" (Ninja 10's kid theme): the starry sky behind every screen and the chunky pastel buttons, one hue
     per button (--h, set on the button). The theme's colours are in theme-milioni.css. Only this theme. ---------- */
  [data-theme=dojo] body {
    background:
      radial-gradient(circle at 12% 14%, rgb(255 255 255 / .85) 0 1.4px, transparent 2px),
      radial-gradient(circle at 81% 8%, rgb(255 255 255 / .7) 0 1.2px, transparent 1.8px),
      radial-gradient(circle at 64% 22%, rgb(255 255 255 / .55) 0 1px, transparent 1.6px),
      radial-gradient(circle at 28% 36%, rgb(255 255 255 / .5) 0 1px, transparent 1.6px),
      radial-gradient(circle at 90% 41%, rgb(255 255 255 / .6) 0 1.3px, transparent 1.9px),
      radial-gradient(circle at 7% 58%, rgb(255 255 255 / .45) 0 1px, transparent 1.6px),
      radial-gradient(circle at 46% 6%, rgb(255 255 255 / .6) 0 1.1px, transparent 1.7px),
      radial-gradient(circle at 72% 63%, rgb(255 255 255 / .35) 0 1px, transparent 1.6px),
      radial-gradient(130% 90% at 50% 0%, #3b3184 0%, #211d52 50%, #14122f 100%);
  }
  [data-theme=dojo] #app .btn.rec {
    --L: .82; --C: .065;
    --btn-color: oklch(var(--L) var(--C) var(--h)); --btn-fg: #1d1b2e; --btn-border: #0000; --btn-inset: 0 0 0 0 #0000;
    --btn-shadow: 0 5px 0 oklch(calc(var(--L) - .13) var(--C) var(--h)), 0 9px 14px rgb(0 0 0 / .22);
    border-width: 0; border-radius: 18px; margin-bottom: 5px; font-weight: 800; transition: translate .07s, box-shadow .07s;
  }
  [data-theme=dojo] #app .btn.rec:active {
    --btn-bg: var(--btn-color); translate: 0 4px;
    --btn-shadow: 0 1px 0 oklch(calc(var(--L) - .13) var(--C) var(--h)), 0 3px 6px rgb(0 0 0 / .2);
  }
  [data-theme=dojo] #app .btn.rec.big { --L: .86; --C: .09; }
  /* the seven chapter tiles (.calm, home mock „A · spokojne kafelki"): one dark tile colour for all seven, only the
     badge keeps the case's colour */
  [data-theme=dojo] #app .btn.rec.calm { --btn-color: #3a3479; --btn-fg: #f1eeff;
    --btn-shadow: 0 4px 0 #1b1846, 0 7px 12px rgb(0 0 0 / .22); margin-bottom: 4px; }
  [data-theme=dojo] #app .btn.rec.calm:active { --btn-bg: #3a3479; --btn-shadow: 0 1px 0 #1b1846; }
  [data-theme=dojo] #home h1 { font-weight: 900; text-shadow: 0 4px 0 rgb(0 0 0 / .28); }
  /* home: the thin faint lines under the title and under the sea sentence */
  #home .hline { border-color: color-mix(in oklab, var(--color-base-content) 18%, transparent); }
  /* the 🏆 squares (Ninja 10's): see-through glass on the sky, the same edge */
  [data-theme=dojo] #app [data-top] {
    --btn-bg: rgb(255 255 255 / .1); --btn-border: rgb(255 255 255 / .28); --btn-shadow: 0 5px 0 rgb(0 0 0 / .35);
    border-width: 2px; border-radius: 18px; margin-bottom: 5px; transition: translate .07s, box-shadow .07s;
  }
  [data-theme=dojo] #app [data-top]:active { translate: 0 4px; --btn-shadow: 0 1px 0 rgb(0 0 0 / .35); }
  /* ⚙️ „Pełny ekran": in full screen the page reaches under the phone's camera hole (viewport-fit=cover) — the
     content keeps out of it. Elsewhere the insets are 0, and outside full screen nothing changes */
  html:fullscreen body {
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
</style>
</head>
<body class="h-full m-0 bg-base-100 text-base-content">
  <main id="app" class="h-full max-w-3xl mx-auto">

    <!-- home = topic 1's menu (the only topic so far). Everything is open from the start (Lasha picked „B").
         Home mock „A · spokojne kafelki": top to bottom the way a child learns — the seven chapters one by one ·
         Kolejność and Pytania i nazwy (all seven together) · the exam at the bottom. No section labels.
         The table is 📋 top left, mirroring ⚙️ (beside ⚙️ it would touch the picture).
         The chapters stand in one column, 1 → 7 top to bottom (Lasha: „გაფანტული ნუმერაცია" in two columns) -->
    <section id="home" class="h-full flex-col p-5 pt-3 gap-3 overflow-y-auto">
      <!-- relative z-10: the picture block below is pulled up over this row (-mt-12) and caught every tap on 📋 / ⚙️ -->
      <div class="flex justify-between relative z-10">
        <button id="goTab" class="btn btn-ghost btn-circle text-2xl" data-ta="m_tab">📋</button>
        <!-- 🖨️ = the parent's Egzamin on paper, beside ⚙️ (Lasha 2026-11-01, mock „ბ"; 9 px clear of the picture) -->
        <div class="flex">
          <button id="toPrint" class="btn btn-ghost btn-circle text-2xl" data-ta="prn_title">🖨️</button>
          <button id="toSet" class="btn btn-ghost btn-circle text-2xl">⚙️</button>
        </div>
      </div>
      <!-- Sunny & Bobi, up between 📋 and ⚙️ (-mt-12) so home does not scroll. The title, the sea sentence and the
           chapters stand apart: a thin faint line under each of the two, 12 px on both sides (Lasha's pick „ბ" + a
           line under the title too) -->
      <div class="flex flex-col items-center gap-1 -mt-12 pb-3 border-b-[1.5px] hline">
        <div id="homeG" class="flex justify-center"></div>
        <h1 class="text-3xl font-black text-primary" data-t="title"></h1>
        <div class="self-stretch my-2 border-t-[1.5px] hline"></div>
        <p id="homeS" class="sent flex justify-center gap-x-1 text-center"></p>
      </div>
      <div id="homeCh" class="flex flex-col gap-1"></div>
      <!-- the two top-10 lists (mock „გ", Lasha 2026-10-30): the practice 🏆 („cw" = the chapters + these two added up)
           beside Kolejność + Pytania i nazwy, the exam's 🏆 beside the exam. No sum line, no name ribbon (home fits) -->
      <div class="flex gap-2">
        <div class="grid grid-cols-2 gap-2 flex-1">
          <button class="btn btn-primary rec h-auto min-h-16" data-m="kol" style="--h:250">
            <span class="nm text-lg leading-tight" data-t="m_kol"></span><span class="ft" id="ft_kol"></span></button>
          <button class="btn btn-primary rec h-auto min-h-16" data-m="pn" style="--h:65">
            <span class="nm text-lg leading-tight" data-t="m_pn"></span><span class="ft" id="ft_pn"></span></button>
        </div>
        <button class="btn btn-outline btn-primary h-auto min-h-16 w-20 text-2xl" data-top="cw">🏆</button>
      </div>
      <div class="flex gap-3 mt-auto shrink-0">
        <button class="btn btn-primary rec big h-auto min-h-16 flex-1" data-m="egz" style="--h:85">
          <span class="nm text-2xl" data-t="m_egz"></span><span class="ft" id="ft_egz"></span></button>
        <button class="btn btn-outline btn-primary h-auto min-h-16 w-20 text-2xl" data-top="egz">🏆</button>
      </div>
    </section>

    <!-- the table, as the textbook's p. 73 „PRZYPADKI RZECZOWNIKA": the seven cases top to bottom, all on one screen
         (Lasha's mock „ა · ორი ხაზი"): no cards, thin lines; badge · name · questions, then helper words · examples,
         small and faint. Only the badges carry colour -->
    <section id="tab" class="h-full flex-col p-5 gap-3">
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost btn-sm text-xl quit">✕</button>
        <h2 class="text-2xl font-bold" data-t="home_sub"></h2>
      </div>
      <div id="tabS" class="sent flex justify-center gap-x-1 text-center"></div>
      <div id="tabL" class="flex-1 overflow-y-auto flex flex-col"></div>
      <button class="btn btn-primary btn-lg btn-block shrink-0 quit" data-t="btn_back"></button>
    </section>

    <!-- ② one chapter of „7 przygód Sunny i Bobiego" (Lasha picked mock „B · one screen"): the chapter's picture (Sunny
         & Bobi, picture mock „B · no frame"), the headline with the case's form in its colour, what happens, the rule,
         this case's p. 73 row, „Zapamiętaj" → „Sprawdź!" = 5 cards -->
    <section id="ch" class="h-full flex-col p-5 gap-3 overflow-y-auto">
      <div class="flex items-center gap-2">
        <button class="btn btn-ghost btn-sm text-xl quit">✕</button>
        <span id="chG" class="flex"></span>
        <h2 id="chN" class="text-2xl font-black"></h2>
      </div>
      <div id="chS" class="sent flex justify-center gap-x-1 text-center"></div>
      <div class="flex-1 flex flex-col justify-center gap-3">
        <div id="chP" class="shrink-0"></div>
        <p id="chH" class="text-2xl font-black text-center leading-tight"></p>
        <div id="chT" class="flex flex-col gap-2 leading-snug opacity-90"></div>
        <div id="chR"></div>
        <div id="chZ" class="bg-base-200 rounded-box px-4 py-2.5 border-l-[6px]"></div>
      </div>
      <button id="chGo" class="btn btn-primary btn-lg btn-block shrink-0" data-t="btn_check"></button>
    </section>

    <!-- drill: 10 cards (the exam 15; Kolejność 7 steps; a chapter's Sprawdź 5), a 5-second bar, the answer buttons. The
         sea sentence on top, except in the exam. Kolejność: the seven names mixed up, tapped from 1 to 7 into the slots
         (#dO). Sprawdź: a sentence with a gap, the right form + two wrong ones under it -->
    <section id="drill" class="h-full flex-col p-5 gap-3 relative overflow-hidden">
      <div class="flex justify-between items-center">
        <button id="dPause" class="btn btn-ghost btn-sm text-xl">✕</button>
        <span id="dCount" class="text-sm opacity-60"></span>
        <span id="dScore" class="text-lg font-bold text-warning"></span>
      </div>
      <div id="dS" class="sent flex justify-center gap-x-1 text-center"></div>
      <div class="h-2 shrink-0 rounded-full bg-base-300 overflow-hidden"><div id="bar" class="h-full bg-primary"></div></div>
      <div class="flex-1 flex flex-col items-center justify-center gap-3 text-center">
        <p id="dPr" class="text-lg opacity-70"></p>
        <div id="dQ" class="text-4xl font-bold leading-tight"></div>
        <div id="dO" class="w-full max-w-xs flex-col gap-1.5" style="display:none"></div>
        <!-- a fixed height: the feedback line must not move the card -->
        <div id="dFb" class="text-2xl h-8 leading-8"></div>
      </div>
      <div id="pad" class="grid grid-cols-2 gap-2"></div>
      <!-- wrong answer: the child's pick with a small ✕, then the right case's badge with its name, question and helper -->
      <div id="dWin" class="win">
        <div id="dWg" class="wg"></div>
        <p id="dWp" class="text-base opacity-70 mb-2"></p>
        <p id="dWn" class="text-3xl font-black"></p>
        <p id="dWq" class="text-3xl font-bold mt-1"></p>
        <p id="dWh" class="text-lg opacity-70 mb-3"></p>
        <!-- the case's „Zapamiętaj" words, as on its chapter screen (Lasha: every mistake shows the words to remember) -->
        <div id="dWz" class="bg-base-100 rounded-box px-4 py-2.5 border-l-[6px] text-left mb-5"></div>
        <button id="dNext" class="btn btn-primary btn-lg btn-block" data-t="btn_next"></button>
      </div>
    </section>

    <!-- result of a round (as Ninja 10): „Rekord" = the record BEFORE this round. Again = the same drill · back = home -->
    <section id="res" class="h-full flex-col p-5 gap-3 text-center overflow-hidden">
      <div class="flex-1 flex flex-col items-center justify-center gap-3 w-full">
        <div id="resEm" class="text-7xl leading-none"></div>
        <h2 id="resTitle" class="text-2xl font-bold leading-tight"></h2>
        <div class="relative grid grid-cols-2 gap-3 w-full mt-5">
          <span id="resNew" class="tag gold rPop absolute z-10 -top-5 left-0 right-0 mx-auto w-max text-lg" data-t="res_rec_new"></span>
          <div id="resNowBox" class="rGlow relative rounded-box bg-base-200 border-2 border-warning/40 pt-8 pb-3">
            <div class="text-xs font-bold uppercase tracking-widest opacity-70" data-t="res_now"></div>
            <div id="resPts" class="text-5xl font-black text-warning tabular-nums"></div>
          </div>
          <div class="rOld rounded-box bg-base-200 border-2 border-transparent pt-8 pb-3">
            <div class="text-xs font-bold uppercase tracking-widest opacity-70" data-t="res_best"></div>
            <div class="text-5xl font-black tabular-nums"><span id="resRec"></span></div>
          </div>
        </div>
        <div class="flex flex-col gap-0.5">
          <p id="resFast" class="text-lg"></p>
          <p id="resOk" class="opacity-70"></p>
        </div>
      </div>
      <!-- the exam only: its mistakes („Do powtórki:"), each with the right answer and the case's „Zapamiętaj"; a long
           list scrolls here, the score above stays -->
      <div id="resErr" class="w-full min-h-0 overflow-y-auto flex flex-col gap-2 text-left" style="display:none"></div>
      <button id="resAgain" class="btn btn-primary btn-lg btn-block gap-2 shrink-0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg><span data-t="btn_again"></span></button>

  var PRACTICE = ["ch0", "ch1", "ch2", "ch3", "ch4", "ch5", "ch6", "kol", "pn"];

  var API = /^https?:$/.test(location.protocol) && !/\.github\.io$/.test(location.hostname)

  // sync() sends „my name + the practice sum + the exam's record" — the whole state, so a send lost offline is simply

  var syncing = null;

  /* ---------- drill ----------
     A card = { type, i }: „pyt" shows the name → pick the questions · „naz" shows the questions → pick the name ·
     „num" shows the name → pick its number · „ord" = one step of Kolejność: tap case i among the seven mixed-up names.
     The answers of pyt / naz / num stand in the cases' order. Pytania i nazwy mixes pyt + naz (5 of each); the exam
     pyt + naz + num (5 of each) + jak (10), gives no help on a wrong answer and never shows the right one — its mistakes

     „spr" = { type, i: the chapter, k: its sentence, e: 1 = from the exam's own sentences }: the sentence with a gap,

     „jak" = { type, i, k, e: 1 }: an exam sentence with its word already in the right form, underlined, no colour →
     pick the case's name (Lasha 2026-11-01: Sunny hears the right form by ear — naming its case shows she KNOWS it) */
  var mode = null, deck = [], card = null, cardI = 0, nFast = 0, nOk = 0, nPts = 0, cardT0 = 0, locked = true, padType = null;
  var miss = false;              // Kolejność: this step already had a wrong tap — it counts as wrong, the right one glows
  var errs = [];                 // the exam's mistakes this round: { c: the card, pick: the child's answer }
  function shuffle(d) {
    for (var i = d.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), x = d[i]; d[i] = d[j]; d[j] = x; }
    return d;
  }
  // n cards of one type: the seven in a random order, again and again, never the same case twice in a row.
  // „spr" / „jak" here = the exam's: one of that case's own exam sentences, at random — a case met twice (10 sentences
  // over 7 cases) gets two different ones
  function dealOne(type, n) {
    var out = [], left = {};
    while (out.length < n) {
      var s = shuffle([0, 1, 2, 3, 4, 5, 6]);
      if (out.length && s[0] === out[out.length - 1].i) s.push(s.shift());
      s.forEach(function (i) {
        if (out.length >= n) return;
        var c = { type: type, i: i };
        if (type === "spr" || type === "jak") {
          if (!left[i] || !left[i].length) left[i] = shuffle(t("exam_spr")[i].map(function (x, k) { return k; }));
          c.e = 1; c.k = left[i].pop();
        }
        out.push(c);
      });
    }
    return out;
  }
  // the exam's 25 cards: 5 each of name → questions, questions → name, name → number, and 10 of its own sentences
  // (Lasha 2026-10-30: „the exam sentences 10, the rest as it is"; was 5 → 20 cards). The sentences ask „Jaki to
  // przypadek?" since 2026-11-01, no longer „pick the form" (spr: 10 → jak: 10 — still 25, the old records stay)
  var EXAM_DECK = { pyt: 5, naz: 5, num: 5, jak: 10 };
  // spec = type → how many cards, all mixed, never the same case twice in a row (1000 tries: 25 cards over 7 cases
  // find such an order in ~1 of 40 shuffles)
  function dealMix(spec) {
    var d = [];
    Object.keys(spec).forEach(function (ty) { d = d.concat(dealOne(ty, spec[ty])); });
    for (var k = 0; k < 1000; k++) {
      shuffle(d);
      if (d.every(function (c, j) { return !j || c.i !== d[j - 1].i; })) break;
    }
    return d;
  }
  function sprOf(c) { return c.e ? t("exam_spr")[c.i][c.k] : t("chapters")[c.i].spr[c.k]; }
  // „jak": the sentence with its right form already in, underlined (HTML)
  function cardText(c) {
    return c.type === "spr" ? sprOf(c)[0] : c.type === "jak" ? sprOf(c)[0].replace("_", "<u>" + sprOf(c)[1] + "</u>")
         : c.type === "naz" ? CASES[c.i].q : CASES[c.i].name;
  }
  function pickText(type, i) {
    return type === "spr" ? sprOf(card)[i] : type === "pyt" ? CASES[i].q : type === "num" ? String(i + 1) : CASES[i].name;
  }
  // the seven answer buttons; for „ord" the names mixed up (never already in order), new for every round;
  // for „spr" the card's three forms, one under the other, new for every card
  function padFor(type) {
    if (padType === type && type !== "spr") return;
    padType = type;
    $("pad").classList.toggle("grid-cols-2", type !== "num" && type !== "spr");
    $("pad").classList.toggle("grid-cols-7", type === "num");
    if (type === "spr") {
      $("pad").innerHTML = shuffle([1, 2, 3]).map(function (n) {
        return '<button class="btn h-auto min-h-14 py-2 text-2xl font-bold" data-i="' + n + '">' + pickText(type, n) + "</button>";
      }).join("");
      return;
    }
    var idx = [0, 1, 2, 3, 4, 5, 6];
    if (type === "ord") while (idx.join() === "0,1,2,3,4,5,6") shuffle(idx);
    $("pad").innerHTML = idx.map(function (i, k) {
      return '<button class="btn h-auto min-h-12 py-2 px-1 text-lg font-bold' + (type !== "num" && k === 6 ? " col-span-2" : "") +
             (type === "num" ? " min-h-16 text-2xl" : "") + '" data-i="' + i + '">' + pickText(type, i) + "</button>";
    }).join("");
  }
  // Kolejność's slots 1–7: the placed ones carry their name in the case's colour, the current one is framed
  function slotsHtml() {
    return CASES.map(function (c, k) {
      var done = k < cardI, now = k === cardI;
      return '<div class="flex items-center gap-2 rounded-field px-3 h-8 border-2 ' +
             (done ? "border-transparent bg-base-200" : now ? "border-primary" : "border-dashed border-base-300") + '">' +
             '<b class="w-6 text-left opacity-70">' + (k + 1) + ".</b>" +
             (done ? '<b class="text-lg" style="color:' + textCol(c.h) + '">' + c.name + "</b>" : "") + "</div>";
    }).join("");
  }
  $("pad").onclick = function (e) { var b = e.target.closest("button"); if (b) answer(+b.dataset.i, b); };

  function barRun(gone) {
    var b = $("bar"), g = Math.min(gone || 0, FAST_MS);
    b.style.transition = "none"; b.style.width = (100 - g / FAST_MS * 100) + "%";
    void b.offsetWidth;          // commit the start width before the transition starts
    b.style.transition = "width " + (FAST_MS - g) + "ms linear"; b.style.width = "0%";
  }
  function barStop() {
    var b = $("bar"), w = getComputedStyle(b).width;
    b.style.transition = "none"; b.style.width = w;
  }

  // drillStart("kol" | "pn" | "egz" | "ch0" … "ch6"); with no argument the same drill again
  function drillStart(m) {
    if (m) mode = m;
    round++;
    var chI = chOf(mode);
    deck = chI >= 0 ? shuffle([0, 1, 2, 3, 4]).map(function (k) { return { type: "spr", i: chI, k: k }; })
         : mode === "egz" ? dealMix(EXAM_DECK) : mode === "pn" ? dealMix({ pyt: 5, naz: 5 })
         : CASES.map(function (c, i) { return { type: "ord", i: i }; });
    cardI = 0; nFast = 0; nOk = 0; nPts = 0; padType = null; errs = [];
    $("dS").innerHTML = sentHtml(chI);
    $("dS").style.display = mode === "egz" ? "none" : "";
    $("dQ").style.display = mode === "kol" ? "none" : "";
    $("dO").style.display = mode === "kol" ? "flex" : "none";
    show("drill");
    nextCard();
    log("drill " + mode + ": " + deck.map(function (c) { return c.type + ":" + CASES[c.i].ab + (c.k !== undefined ? c.k + 1 : ""); }).join(" · "));
  }
  function nextCard() {
    if (pz) { pz.next = true; return; }   // paused: the card (or the result) comes when the child goes on
    if (cardI >= deck.length) { finish(); return; }
    card = deck[cardI];
    miss = false;
    padFor(card.type);
    Array.prototype.forEach.call($("pad").children, function (b) { b.classList.remove("btn-success", "xNo", "ring-4", "ring-warning"); });
    $("dPr").textContent = t("q_" + card.type);
    if (card.type === "ord") $("dO").innerHTML = slotsHtml();
    else if (card.type === "spr") $("dQ").innerHTML = cardText(card).replace("_", '<span class="gap"></span>');
    else if (card.type === "jak") $("dQ").innerHTML = cardText(card);
    else $("dQ").textContent = cardText(card);
    $("dQ").classList.toggle("sq", card.type === "spr" || card.type === "jak");
    $("dQ").classList.remove("xNo");
    $("dFb").textContent = "";
    $("dWin").className = "win";
    $("pad").classList.remove("dim");
    $("dCount").textContent = (cardI + 1) + " / " + deck.length;
    $("dScore").textContent = nPts;
    barRun();
    cardT0 = performance.now();
    locked = false;
  }
  function answer(i, btn) {
    if (locked) return;
    if (card.type === "ord") { ordAnswer(i, btn); return; }
    locked = true;
    var ms = Math.round(performance.now() - cardT0), c = CASES[card.i], q = cardText(card), pick = pickText(card.type, i);
    barStop();
    cardI++;
    var spr = card.type === "spr";
    if (spr ? i === 1 : i === card.i) {
      var fast = ms <= FAST_MS, pts = points(ms);
      nOk++; if (fast) nFast++;
      nPts += pts;
      sfx("good");
      btn.classList.add("btn-success");
      // Sprawdź: the word goes into the gap, in the case's colour — a moment longer, to read the whole sentence
      if (spr) {
        var g = $("dQ").querySelector(".gap");
        g.className = "gap ok pop"; g.textContent = pick; g.style.color = textCol(c.h);
      }
      // Jaki to przypadek?: the underlined word takes its case's colour, the same moment longer
      if (card.type === "jak") $("dQ").querySelector("u").style.color = textCol(c.h);
      $("dFb").innerHTML = t(fast ? "fb_fast" : "fb_ok") + ' <b class="pop text-warning">+' + pts + "</b>";
      $("dScore").textContent = nPts;
      log(card.type + " " + q + " → " + pick + " ✓ " + (ms / 1000).toFixed(3) + "s +" + pts + (fast ? " ⚡" : " (slow)"));
      var r = round;
      setTimeout(function () { if (r === round) nextCard(); }, spr || card.type === "jak" ? 1100 : 700);
    } else if (mode === "egz") {
      sfx("bad");
      $("dQ").classList.add("xNo");
      errs.push({ c: card, pick: pick });
      log(card.type + " " + q + " → " + pick + " ✗ (wanted " + (spr ? sprOf(card)[1] : pickText(card.type, card.i)) +
          ") · exam: no help");
      var r2 = round;
      setTimeout(function () { if (r2 === round) nextCard(); }, 900);
    } else {
      // wrong: the sheet slides up — the child's pick with ✕, then the right case's badge + name, questions, helper, its „Zapamiętaj" words
      sfx("bad");
      $("dWg").innerHTML = badgeSvg(card.i, 72);
      $("dWp").innerHTML = '<b class="text-error">✕</b> ' + pick;
      $("dWn").textContent = c.name;
      $("dWn").style.color = textCol(c.h);
      // Sprawdź: the whole sentence with the right form, its questions + helper under it
      if (spr) $("dWq").innerHTML = q.replace("_", '<span style="color:' + textCol(c.h) + '">' + sprOf(card)[1] + "</span>");
      else $("dWq").textContent = c.q;
      $("dWh").textContent = spr ? c.q + " " + c.help : c.help;
      $("dWz").style.borderColor = hatCol(c.h);
      $("dWz").innerHTML = zapHtml(card.i);
      $("pad").classList.add("dim");
      var w = $("dWin");
      w.className = "win"; void w.offsetWidth; w.classList.add("on");   // restart the slide-up
      log(card.type + " " + q + " → " + pick + " ✗ (wanted " + (spr ? sprOf(card)[1] : c.name) + ")");
    }
  }
  // Kolejność: the right name goes into its slot (its button stays as an empty place, so the others do not move).
  // A wrong tap shakes that button and the right one glows; the step then counts as wrong, the child taps the right
  // one to go on
  function ordAnswer(i, btn) {
    var ms = Math.round(performance.now() - cardT0), c = CASES[card.i];
    if (i !== card.i) {
      sfx("bad");
      btn.classList.remove("xNo"); void btn.offsetWidth; btn.classList.add("xNo");
      if (!miss) {
        miss = true; barStop();
        $("pad").querySelector('[data-i="' + card.i + '"]').classList.add("ring-4", "ring-warning");
      }
      log("ord " + (cardI + 1) + " → " + CASES[i].name + " ✗ (wanted " + c.name + ")");
      return;
    }
    locked = true;
    barStop();
    btn.classList.add("invisible");
    if (miss) {
      $("dFb").textContent = "";
      log("ord " + (cardI + 1) + " → " + c.name + " ✓ after a wrong tap");
    } else {
      var fast = ms <= FAST_MS, pts = points(ms);
      nOk++; if (fast) nFast++;
      nPts += pts;
      sfx("good");
      $("dFb").innerHTML = t(fast ? "fb_fast" : "fb_ok") + ' <b class="pop text-warning">+' + pts + "</b>";
      $("dScore").textContent = nPts;
      log("ord " + (cardI + 1) + " → " + c.name + " ✓ " + (ms / 1000).toFixed(3) + "s +" + pts + (fast ? " ⚡" : " (slow)"));
    }
    cardI++;
    $("dO").innerHTML = slotsHtml();
    var r = round;
    setTimeout(function () { if (r === round) nextCard(); }, 450);
  }
  // „Dalej" slides the sheet down first; the next card comes when the slide ends
  $("dNext").onclick = function () {
    var w = $("dWin");
    if (w.classList.contains("on") && !w.classList.contains("off")) w.classList.add("off");
  };
  $("dWin").addEventListener("animationend", function (e) {
    var w = $("dWin");
    if (e.target !== w || !w.classList.contains("off")) return;
    nextCard();
  });

  // The pause (as Ninja 10): back or ✕ in a drill. pz = { ms: the card's clock so far (-1 = not running), next: a card
  // that came due meanwhile, go: the child's pick }. However the window closes, its „close" decides.
  var pz = null;
  function pauseOpen() {
    if (pz) return;
    pz = { ms: locked || miss ? -1 : performance.now() - cardT0, next: false, go: "" };
    barStop();
    $("pauseAsk").showModal();
    log("pause · card " + (cardI + 1) + " / " + deck.length);
  }
  function pauseGo(go) { pz.go = go; $("pauseAsk").close(); }
  $("dPause").onclick = pauseOpen;
  $("pauseAgain").onclick = function () { pauseGo("again"); };
  $("pauseOn").onclick = function () { pauseGo("on"); };
  $("pauseOut").onclick = function () { pauseGo("out"); };
  $("pauseAsk").addEventListener("close", function () {
    var p = pz; pz = null;
    if (!p) return;
    log("pause → " + (p.go || "on"));
    if (p.go === "again") drillStart();
    else if (p.go === "out") goHome();
    else if (p.next) nextCard();
    else if (p.ms >= 0) { cardT0 = performance.now() - p.ms; barRun(p.ms); }
  });

  /* ---------- result ---------- */
  function finish() {
    var need = (MODES[mode] || CH_MODE).m, b = S.best[mode] || { fast: 0, ok: 0, master: false }, master = nFast >= need;
    if (nFast > b.fast || (nFast === b.fast && nOk > b.ok)) { b.fast = nFast; b.ok = nOk; }
    b.master = b.master || master;
    var prev = b.pts, newRec = nPts > 0 && (prev === undefined || nPts > prev);
    if (newRec) b.pts = nPts;
    b.n = deck.length;
    S.best[mode] = b; save();
    $("resEm").innerHTML = master ? danceHtml() : "💪";
    $("resTitle").textContent = master ? t("res_master") : t("res_more", need);
    $("resFast").textContent = t("res_fast", nFast, deck.length);
    $("resOk").textContent = t("res_ok", nOk, deck.length);
    $("resRec").textContent = prev === undefined ? "—" : prev;
    $("resRec").classList.toggle("rStrike", prev !== undefined);
    $("resNew").style.display = newRec ? "" : "none";
    $("resErr").style.display = mode === "egz" ? "" : "none";
    $("resErr").innerHTML = mode === "egz" ? errsHtml() : "";
    $("resErr").scrollTop = 0;
    show("res");
    resCount(nPts, newRec, prev);
    if (master) sfx("yes");
    log("round done: " + nPts + " points" + (newRec ? " (record)" : "") + " · fast " + nFast + " · correct " + nOk +
        (master ? " · <b>MASTERED</b>" : ""));
    if (newRec) sync();
  }
  // the exam's mistakes: the card with its right answer in the case's colour (a sentence: the form in its gap), the
  // child's pick with ✕, the case's „Zapamiętaj" box as on the wrong sheet. No mistakes → one line
  function errsHtml() {
    if (!errs.length) return '<p class="text-xl font-black text-center">' + t("res_noerr") + "</p>";
    return '<p class="text-sm font-extrabold opacity-70">' + t("res_err") + "</p>" + errs.map(function (e) {
      var c = e.c, k = CASES[c.i], col = textCol(k.h), right, line;
      if (c.type === "spr") {
        right = sprOf(c)[1];
        line = sprOf(c)[0].replace("_", '<span style="color:' + col + '">' + right + "</span>");
      } else {
        right = pickText(c.type, c.i);
        line = cardText(c) + ' → <span style="color:' + col + '">' + right + "</span>";
      }
      return '<div class="bg-base-200 rounded-box px-4 py-2.5 border-l-[6px] shrink-0" style="border-color:' + hatCol(k.h) +
             '"><p class="text-xl font-bold leading-tight">' + line + '</p><p class="opacity-70 mb-1"><b class="text-error">✕</b> ' +
             e.pick + "</p>" + zapHtml(c.i) + "</div>";
    }).join("");
  }
  // the score counts up from 0; when it passes the old record (a first record: when the count ends) #res gets .rBeat
  var RES_MS = 1400, RES_WAIT = 300, resTok = 0;
  var RES_STAR = '<svg viewBox="0 0 100 100"><path d="M50 3 L61 39 L97 50 L61 61 L50 97 L39 61 L3 50 L39 39 Z" fill="currentColor"/></svg>';
  function resCount(to, newRec, prev) {
    var tok = ++resTok, el = $("resPts"), t0 = null, done = !newRec;
    $("res").classList.remove("rBeat");
    el.textContent = 0;
    function step(ts) {
      if (tok !== resTok || current !== "res") return;
      if (t0 === null) t0 = ts;
      var p = Math.min(1, (ts - t0) / RES_MS), v = Math.round(to * (1 - Math.pow(1 - p, 3)));
      el.textContent = v;
      if (!done && (prev === undefined ? p >= 1 : v > prev)) { done = true; $("res").classList.add("rBeat"); resBurst($("resNowBox")); }
      if (p < 1) requestAnimationFrame(step);
    }
    setTimeout(function () { requestAnimationFrame(step); }, RES_WAIT);
  }
  function resBurst(host) {
    var cols = ["text-warning", "text-primary", "text-accent", "text-secondary"];
    for (var i = 0; i < 12; i++) {
      var a = i / 12 * Math.PI * 2 + Math.random() * 0.4, d = 70 + Math.random() * 60, sp = document.createElement("span");
      sp.className = "rBs " + cols[i % 4];
      sp.style.setProperty("--dx", Math.cos(a) * d + "px");
      sp.style.setProperty("--dy", Math.sin(a) * d + "px");
      sp.style.setProperty("--r", (Math.random() * 540 - 270) + "deg");
      sp.innerHTML = RES_STAR;
      sp.addEventListener("animationend", function () { this.remove(); });
      host.appendChild(sp);
    }
  }
  $("resAgain").onclick = function () { drillStart(); };

  /* ---------- 🖨️ the Egzamin on paper (Lasha 2026-11-01: v2 of the sheet + home mock „ბ"). Page 1 = the child's:
     ① 10 exam sentences, the word already right and underlined → write its question + case (Sunny hears the right
     form by ear — naming the case shows she KNOWS it) · ② one word (tata / mama / lalka) through the seven cases.
     Page 2 = the answers, each with its case's „Zapamiętaj". 1 point a box. Every open and 🎲 deals a new sheet.
     Print rule: only borders and text — browsers drop CSS backgrounds when printing ---------- */
  var SH_WORDS = { tata: 0, mama: 1, lalka: 3 };   // exam_spr's column: the same word in every case's row
  var SH_N = 10, SH_POINTS = SH_N * 2 + 7 * 3, SH_PASS = Math.ceil(SH_POINTS * .8);   // 20 + 21 = 41, pass 33
  var SHEET_CSS = [
    "@page { size: A4; margin: 12mm 13mm; }",
    "* { box-sizing: border-box; }",
    'body { margin: 0; background: #fff; color: #1d1b2e; font: 13pt/1.35 "Segoe UI", Arial, sans-serif; }',
    ".page { width: 210mm; min-height: 297mm; padding: 12mm 13mm; }",
    ".head { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #1d1b2e; padding-bottom: 6px; }",
    "h1 { font-size: 21pt; margin: 0; } h1 small { display: block; font-size: 11pt; font-weight: 400; opacity: .7; }",
    ".who { display: flex; gap: 8mm; margin: 4mm 0 2mm; font-size: 12pt; }",
    ".who span { flex: 1; border-bottom: 1.5px dotted #1d1b2e; padding-bottom: 1mm; } .who span.w { flex: 0 0 34mm; }",
    "h2 { font-size: 13.5pt; margin: 6mm 0 1.5mm; } h2 small { display: block; font-weight: 400; opacity: .7; font-size: 11pt; }",
    "table { width: 100%; border-collapse: collapse; }",
    "th { font-size: 10pt; font-weight: 600; text-align: left; opacity: .65; padding: 1mm 1.5mm; border-bottom: 1.5px solid #1d1b2e; }",
    "td { padding: 0 1.5mm; height: 10.5mm; border-bottom: 1px solid #ccc; }",
    "td.n { width: 8mm; font-weight: 700; opacity: .6; text-align: right; } td.f { border-left: 1px dashed #ccc; }",
    "u { text-decoration-thickness: 2px; text-underline-offset: 3px; font-weight: 700; }",
    ".key td { height: auto; padding: 1.2mm 1.5mm; font-size: 10.5pt; vertical-align: top; }",
    ".key td.z { opacity: .8; font-style: italic; } .key b { white-space: nowrap; }",
    ".pass { margin: 3mm 0; font-size: 11.5pt; }",
    "@media print { .page { padding: 0; width: auto; min-height: 0; } .page + .page { break-before: page; } }"
  ].join("\n");
  function sheetHtml() {
    var words = Object.keys(SH_WORDS), word = words[Math.floor(Math.random() * words.length)],
        forms = t("exam_spr").map(function (row) { return row[SH_WORDS[word]][1].toLowerCase(); }),
        sents = dealOne("jak", SH_N);   // a case met twice gets two different sentences
    function zap(i) { return t("zap") + " " + t("chapters")[i].zap.join(" "); }
    function row(k, cells) { return '<tr><td class="n">' + (k + 1) + ".</td>" + cells + "</tr>"; }
    log("print: " + sents.map(function (c) { return CASES[c.i].ab + (c.k + 1); }).join(" · ") + " · odmiana: " + word);
    return '<!DOCTYPE html><html lang="pl"><head><meta charset="utf-8"><title>' + t("title") + " — " + t("sh_exam") +
      "</title><style>" + SHEET_CSS + "</style></head><body>" +
      '<div class="page"><div class="head"><h1>' + t("title") + "<small>" + t("sh_exam") + "</small></h1>" + heroesSvg() + "</div>" +
      '<div class="who"><span>' + t("sh_name") + "</span><span>" + t("sh_date") + '</span><span class="w">' + t("sh_score") +
      " &nbsp; &nbsp; / " + SH_POINTS + "</span></div>" +
      "<h2>" + t("sh_jak") + "<small>" + t("sh_jak_do") + "</small></h2>" +
      "<table><tr><th></th><th>" + t("sh_sent") + '</th><th style="width:40mm">' + t("sh_q") + '</th><th style="width:46mm">' +
      t("sh_case") + "</th></tr>" + sents.map(function (c, k) {
        return row(k, "<td>" + cardText(c) + '</td><td class="f"></td><td class="f"></td>');
      }).join("") + "</table>" +
      "<h2>" + t("sh_odm", word) + "<small>" + t("sh_odm_do") + "</small></h2>" +
      "<table><tr><th></th><th>" + t("sh_case") + '</th><th style="width:52mm">' + t("sh_qs") + '</th><th style="width:46mm">' +
      word + "</th></tr>" + CASES.map(function (c, k) {
        return row(k, '<td></td><td class="f"></td><td class="f"></td>');
      }).join("") + "</table></div>" +
      '<div class="page"><div class="head"><h1>' + t("sh_key") + "<small>" + t("sh_key_for") + "</small></h1></div>" +
      '<p class="pass">' + t("sh_pass", SH_POINTS, SH_PASS) + "</p>" +
      "<h2>" + t("sh_jak") + '</h2><table class="key">' + sents.map(function (c, k) {
        return row(k, "<td>" + cardText(c) + "</td><td><b>" + CASES[c.i].q + "</b></td><td><b>" + CASES[c.i].name +
                      '</b></td><td class="z">' + zap(c.i) + "</td>");
      }).join("") + "</table>" +
      "<h2>" + t("sh_key_odm", word) + '</h2><table class="key">' + CASES.map(function (c, k) {
        return row(k, "<td><b>" + c.name + "</b></td><td>" + c.q + "</td><td><b>" + forms[k] + (k === 6 ? "!" : "") +
                      '</b></td><td class="z">' + zap(k) + "</td>");
      }).join("") + "</table></div></body></html>";
  }
  function writeSheet() {
    var doc = $("prSheet").contentWindow.document;
    doc.open(); doc.write(sheetHtml()); doc.close();
  }
  // the sheet takes whatever room is left: as wide as the screen, or as tall as the space, whichever runs out first
  function fitPreview() {
    var box = $("prBox"), pv = $("prPv"),
        w = Math.max(60, Math.floor(Math.min(box.clientWidth - 24, (box.clientHeight - 12) * 210 / 297)));
    pv.style.width = w + "px"; pv.style.height = Math.round(w * 297 / 210) + "px";
    $("prSheet").style.transform = "scale(" + (w / 794) + ")";
  }
  new ResizeObserver(fitPreview).observe($("prBox"));
  $("toPrint").onclick = function () { show("print"); writeSheet(); fitPreview(); log("print: open"); };
  $("prAgain").onclick = function () { writeSheet(); log("print: new tasks"); };
  $("prGo").onclick = function () { log("print: → printer"); $("prSheet").contentWindow.print(); };

  /* ---------- settings: start over ---------- */
  $("resetGo").onclick = function () { $("resetAsk").showModal(); };
  $("resetNo").onclick = function () { $("resetAsk").close(); };
  // Wipes the whole save and reloads: the app opens as on its very first launch (pick → name) with a new uid. The old
  // uid's records stay on the server (as Ninja 10)
  $("resetYes").onclick = function () {
    wiped = true;
    try { localStorage.removeItem(SAVE_KEY); } catch (e) {}
    log("start over: save wiped");
    location.reload();
  };

  load();
  $("sndToggle").checked = S.sound;
  applyTheme();
  applyLang();
  renderBest();
  drawKid();
  if (!S.g) show("pick");
  else if (!S.name) askName();
  // one full send per launch: a record made offline last time goes now, and a row the server lost comes back
  else { show("home"); S.sent = ""; sync(); }
  // the offline copy (sw.js) — only over http(s): sim.html opens the app as a file
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
